<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar Panel Maintenance System - Short Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(
          180deg,
          #0a0a0a 0%,
          #1a2a1a 50%,
          #2d3d1a 100%
        );
        color: #e8f5e9;
        overflow: hidden;
      }

      .container {
        display: grid;
        grid-template-columns: 1fr 500px;
        height: 100vh;
        gap: 20px;
        padding: 20px;
      }

      /* Dashboard Section */
      .dashboard {
        display: flex;
        flex-direction: column;
        gap: 20px;
        overflow-y: auto;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        backdrop-filter: blur(10px);
      }

      .header-icon {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, #76ff03 0%, #cddc39 100%);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }

      .header-icon svg {
        width: 100%;
        height: 100%;
      }

      .header h1 {
        font-size: 24px;
        font-weight: 600;
        background: linear-gradient(135deg, #76ff03 0%, #cddc39 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
      }

      .stat-card {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 20px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .stat-card .label {
        font-size: 12px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }

      .stat-card .value {
        font-size: 28px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 4px;
      }

      .stat-card .change {
        font-size: 12px;
        color: #76ff03;
      }

      /* ChatBox Section */
      .chatbox-container {
        display: flex;
        flex-direction: column;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      .chatbox-header {
        padding: 20px;
        background: rgba(255, 255, 255, 0.05);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .chatbox-header h2 {
        font-size: 18px;
        font-weight: 600;
        background: linear-gradient(135deg, #76ff03 0%, #cddc39 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .chatbox-header h2 svg {
        width: 24px;
        height: 24px;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .message {
        display: flex;
        gap: 12px;
        animation: fadeIn 0.5s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        flex-direction: row-reverse;
      }

      .message-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: 8px;
      }

      .message-avatar svg {
        width: 100%;
        height: 100%;
      }

      .message.user .message-avatar {
        background: linear-gradient(135deg, #546e7a 0%, #37474f 100%);
      }

      .message.bot .message-avatar {
        background: linear-gradient(135deg, #76ff03 0%, #64dd17 100%);
      }

      .message-content {
        background: rgba(255, 255, 255, 0.08);
        padding: 12px 16px;
        border-radius: 16px;
        max-width: 80%;
        line-height: 1.5;
      }

      .message.user .message-content {
        background: linear-gradient(135deg, #546e7a 0%, #37474f 100%);
      }

      /* Tool execution status */
      .tool-execution {
        background: rgba(118, 255, 3, 0.1);
        border-left: 3px solid #76ff03;
        padding: 8px 12px;
        margin-top: 8px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 13px;
        color: #76ff03;
        animation: fadeIn 0.3s ease-in;
      }

      .tool-details {
        margin-top: 6px;
        padding-left: 12px;
        font-size: 12px;
        color: #888;
        font-weight: 400;
        line-height: 1.6;
      }

      .tool-details div {
        margin: 2px 0;
      }

      .typing-indicator {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }

      .typing-indicator span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #76ff03;
        animation: typing 1.4s infinite;
      }

      .typing-indicator span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing-indicator span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes typing {
        0%,
        60%,
        100% {
          opacity: 0.3;
          transform: scale(0.8);
        }
        30% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .status-badge.success {
        background: rgba(118, 255, 3, 0.2);
        color: #76ff03;
      }

      .status-badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(118, 255, 3, 0.3);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(118, 255, 3, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Dashboard Section -->
      <div class="dashboard">
        <div class="header">
          <div class="header-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M12 2V4M12 20V22M4 12H2M6.31412 6.31412L4.8999 4.8999M17.6859 6.31412L19.1001 4.8999M6.31412 17.69L4.8999 19.1042M17.6859 17.69L19.1001 19.1042M22 12H20M17 12C17 14.7614 14.7614 17 12 17C9.23858 17 7 14.7614 7 12C7 9.23858 9.23858 7 12 7C14.7614 7 17 9.23858 17 12Z"
                stroke="#0a0a0a"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div>
            <h1>Solar Panel Maintenance System</h1>
            <div style="display: flex; gap: 12px; margin-top: 8px">
              <span class="status-badge success" id="systemStatus">
                <span class="dot"></span>
                System Optimal
              </span>
            </div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="label">Total Power Output</div>
            <div class="value">4.5 kW</div>
            <div class="change">↑ 100% Optimal</div>
          </div>
          <div class="stat-card">
            <div class="label">System Efficiency</div>
            <div class="value">94%</div>
            <div class="change">↑ Excellent</div>
          </div>
          <div class="stat-card">
            <div class="label">Active Panels</div>
            <div class="value">18/18</div>
            <div class="change">✓ All Online</div>
          </div>
          <div class="stat-card">
            <div class="label">Daily Revenue</div>
            <div class="value">$31.20</div>
            <div class="change">↑ Target Met</div>
          </div>
        </div>
      </div>

      <!-- ChatBox Section -->
      <div class="chatbox-container">
        <div class="chatbox-header">
          <h2>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M12 2C10.8954 2 10 2.89543 10 4V5H6C4.89543 5 4 5.89543 4 7V18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 18V7C20 5.89543 19.1046 5 18 5H14V4C14 2.89543 13.1046 2 12 2Z"
                fill="currentColor"
              />
              <circle cx="9" cy="11" r="1" fill="#0a0a0a" />
              <circle cx="15" cy="11" r="1" fill="#0a0a0a" />
              <path
                d="M9 15H15"
                stroke="#0a0a0a"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            AI Diagnostic Assistant
          </h2>
        </div>
        <div class="messages" id="messages">
          <div class="message bot">
            <div class="message-avatar">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M12 2C10.8954 2 10 2.89543 10 4V5H6C4.89543 5 4 5.89543 4 7V18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 18V7C20 5.89543 19.1046 5 18 5H14V4C14 2.89543 13.1046 2 12 2Z"
                  fill="currentColor"
                />
                <circle cx="9" cy="11" r="1.5" fill="#0a0a0a" />
                <circle cx="15" cy="11" r="1.5" fill="#0a0a0a" />
                <path
                  d="M9 15H15"
                  stroke="#0a0a0a"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <div class="message-content">
              Hello! I'm your AI assistant. How can I help you today?
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const messagesContainer = document.getElementById("messages");

      function addMessage(text, isUser = false, toolExecution = null) {
        return new Promise((resolve) => {
          const messageDiv = document.createElement("div");
          messageDiv.className = `message ${isUser ? "user" : "bot"}`;

          const avatar = document.createElement("div");
          avatar.className = "message-avatar";

          if (isUser) {
            avatar.innerHTML =
              '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" fill="currentColor"/><path d="M12 14C6.47715 14 2 17.5817 2 22H22C22 17.5817 17.5228 14 12 14Z" fill="currentColor"/></svg>';
          } else {
            avatar.innerHTML =
              '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C10.8954 2 10 2.89543 10 4V5H6C4.89543 5 4 5.89543 4 7V18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 18V7C20 5.89543 19.1046 5 18 5H14V4C14 2.89543 13.1046 2 12 2Z" fill="currentColor"/><circle cx="9" cy="11" r="1.5" fill="#0a0a0a"/><circle cx="15" cy="11" r="1.5" fill="#0a0a0a"/><path d="M9 15H15" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"/></svg>';
          }

          const content = document.createElement("div");
          content.className = "message-content";

          messageDiv.appendChild(avatar);
          messageDiv.appendChild(content);
          messagesContainer.appendChild(messageDiv);
          messagesContainer.scrollTop = messagesContainer.scrollHeight;

          if (isUser) {
            content.textContent = text;
            setTimeout(resolve, 500);
          } else {
            // Streaming effect
            let index = 0;
            const interval = setInterval(() => {
              if (index < text.length) {
                content.textContent = text.substring(0, index + 1);
                index++;
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
              } else {
                clearInterval(interval);

                // Add tool execution status if provided
                if (toolExecution) {
                  const toolDiv = document.createElement("div");
                  toolDiv.className = "tool-execution";
                  toolDiv.textContent = toolExecution.title;

                  if (toolExecution.details) {
                    const detailsDiv = document.createElement("div");
                    detailsDiv.className = "tool-details";
                    detailsDiv.innerHTML = toolExecution.details;
                    toolDiv.appendChild(detailsDiv);
                  }

                  content.appendChild(toolDiv);
                }

                setTimeout(resolve, 800);
              }
            }, 30);
          }
        });
      }

      function showTypingIndicator() {
        const messageDiv = document.createElement("div");
        messageDiv.className = "message bot";
        messageDiv.id = "typing";

        const avatar = document.createElement("div");
        avatar.className = "message-avatar";
        avatar.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C10.8954 2 10 2.89543 10 4V5H6C4.89543 5 4 5.89543 4 7V18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 18V7C20 5.89543 19.1046 5 18 5H14V4C14 2.89543 13.1046 2 12 2Z" fill="currentColor"/><circle cx="9" cy="11" r="1.5" fill="#0a0a0a"/><circle cx="15" cy="11" r="1.5" fill="#0a0a0a"/><path d="M9 15H15" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"/></svg>';

        const content = document.createElement("div");
        content.className = "message-content";
        content.innerHTML =
          '<div class="typing-indicator"><span></span><span></span><span></span></div>';

        messageDiv.appendChild(avatar);
        messageDiv.appendChild(content);
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function removeTypingIndicator() {
        const typing = document.getElementById("typing");
        if (typing) typing.remove();
      }

      // Auto-play demo
      async function autoPlayDemo() {
        await new Promise((resolve) => setTimeout(resolve, 2000));

        // Step 1: User question
        await addMessage(
          "Can you help me send the drone to solar panel one?",
          true
        );

        // Step 2: AI processing
        showTypingIndicator();
        await new Promise((resolve) => setTimeout(resolve, 1500));
        removeTypingIndicator();

        // Step 3: AI response
        await addMessage("Drone dispatched to Panel P-001.", false, {
          title: "send_drone",
          details:
            "<div>✓ Target: Panel P-001</div><div>✓ Drone: DRONE-01</div><div>✓ ETA: 45 seconds</div>",
        });
      }

      // Start auto-play when page loads
      window.addEventListener("load", autoPlayDemo);
    </script>
  </body>
</html>
